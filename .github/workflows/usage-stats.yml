name: Archive Xmake usage statistics
on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: usage-statistics
  cancel-in-progress: false
jobs:
  collect:
    if: github.repository == 'xmake-io/xmake-docs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Collect and merge daily history
        run: node scripts/collect-usage-stats.mjs
        env:
          XMAKE_STATS_TOKEN: ${{ secrets.XMAKE_STATS_TOKEN }}
      - name: Save history
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/.vitepress/data/usage-stats.json
          if ! git diff --cached --quiet; then
            git commit -m 'docs: update usage statistics'
            git pull --rebase origin master
            git push origin HEAD:master
          fi
      # GITHUB_TOKEN pushes do not trigger push workflows; explicitly dispatch deployment.
      - name: Publish updated charts
        run: gh workflow run azure-static-web-apps-thankful-water-0bb1cb90f.yml --ref master
        env:
          GH_TOKEN: ${{ github.token }}
